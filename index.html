<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건강 이슈 사례 뱅크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f5145;--green2:#2e6b5c;--head:#1f5145;--gold:#b5781f;--gold2:#e9b45a;--mint:#e6efec;--beige:#f3e6cf;--ink:#1d2b27;--muted:#5d6f69;--line:#d5e0dc;--bg:#fbfaf6;--card:#ffffff;--field:#ffffff;--zebra:#f5f8f7;--on:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--green:#2f7a66;--green2:#7cc4ad;--head:#9fd8c5;--gold:#e0a54e;--gold2:#f0c274;--mint:#1f2e2a;--beige:#3a3123;--ink:#e3ece8;--muted:#9fb3ac;--line:#2f403b;--bg:#111816;--card:#18221f;--field:#1d2925;--zebra:#1b2623;--on:#ffffff;--err:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--green:#2f7a66;--green2:#7cc4ad;--head:#9fd8c5;--gold:#e0a54e;--gold2:#f0c274;--mint:#1f2e2a;--beige:#3a3123;--ink:#e3ece8;--muted:#9fb3ac;--line:#2f403b;--bg:#111816;--card:#18221f;--field:#1d2925;--zebra:#1b2623;--on:#ffffff;--err:#ff8a7a;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
.eyebrow{color:var(--gold);font-weight:700;font-size:13px}
h1{color:var(--head);font-size:28px;margin:4px 0 6px}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:var(--on)}
.btn.ghost{background:transparent;color:var(--head);border:1px solid var(--head)}
.btn.gold{background:var(--gold)}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.deck{grid-template-columns:repeat(2,1fr)}}
.slot{perspective:900px;height:180px;cursor:pointer}
.flip{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.slot.open .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.back{background:var(--green);color:var(--on);align-items:center;justify-content:center;text-align:center}
.back b{font-size:46px;color:var(--gold2);line-height:1}
.back span{font-size:13px;opacity:.8;margin-top:6px}
.front{transform:rotateY(180deg);background:var(--card);border:2px solid var(--green)}
.front .no{color:var(--gold);font-weight:700;font-size:22px}
.front h3{margin:0;color:var(--head);font-size:20px}
.front p{margin:0;font-size:13px;color:var(--muted)}
.front .team{align-self:flex-start;background:var(--beige);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}
.detail{margin-top:22px}
.case{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;break-inside:avoid}
.case header{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--green);padding-bottom:8px;margin-bottom:12px}
.case header .no{color:var(--gold);font-weight:700;font-size:26px}
.case header h2{margin:0;color:var(--head);font-size:22px}
.case header .q{margin-left:auto;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.case header{flex-wrap:wrap}.case header .q{margin-left:0}}
.field h4{margin:0 0 2px;font-size:13px;color:var(--gold)}
.field p,.field ul{margin:0;font-size:14px}
.field ul{padding-left:18px}
.wide{grid-column:1/-1}
.debate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.debate div{border-radius:8px;padding:10px 12px;font-size:14px}
.debate .pro{background:var(--beige)}.debate .con{background:var(--mint)}
.debate b{display:block;font-size:12px;color:var(--head)}
@media (max-width:760px){.debate{grid-template-columns:1fr}}
.src{margin-top:14px}
.src h4{margin:0 0 6px;font-size:13px;color:var(--gold)}
.src table{width:100%;border-collapse:collapse;font-size:13px}
.src th{background:var(--green);color:var(--on);text-align:left;padding:6px 8px;font-weight:500}
.src td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.src a{color:var(--green2);word-break:break-all}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.slips{display:none}
.golink{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--beige);border-radius:8px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.golink span{font-size:14px}
.golink a{text-decoration:none}
.ask{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--green);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.ask p{margin:0;font-weight:500;color:var(--ink)}
.copybox{width:100%;min-height:90px;margin-top:10px;font-size:12px}
.btn:focus-visible,.pick:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.flip{transition:none}}
.hidden{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12px}
  .bar,.deck,.lead,.screen-only,.golink{display:none!important}
  .wrap{padding:0;max-width:none}
  .case{border:1px solid #999;page-break-inside:avoid;padding:14px;margin-bottom:10mm}
  .case:nth-of-type(2n){page-break-after:always}
  .detail .case.hidden{display:block!important}
  body.print-slips .detail,body.print-slips h1,body.print-slips .eyebrow{display:none}
  body.print-slips .slips{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .slip{border:1px dashed #888;height:85mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .slip b{font-size:40px;color:var(--gold)}
  .slip h3{font-size:26px;color:var(--head);margin:6px 0}
  .slip p{font-size:13px;color:#444;margin:0 12mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">커뮤니케이션이 할 수 있는 것과 없는 것</div>
  <h1>건강 이슈 사례 뱅크</h1>
  <p class="lead">조 이름을 고른 뒤 카드를 한 장 눌러 뽑으세요. 뽑힌 카드의 사건 개요와 참고 자료가 아래에 나옵니다.</p>

  <div class="bar screen-only">
    <select id="team" class="btn ghost" style="font-weight:500;background:var(--card)" aria-label="뽑는 조"></select>
    <button class="btn gold" id="shuffle">카드 섞기</button>
    <button class="btn ghost" id="showall">전체 사례 보기</button>
    <button class="btn ghost localonly" id="printcards">사례 카드 인쇄</button>
    <button class="btn ghost localonly" id="printslips">뽑기 쪽지 인쇄</button>
  </div>

  <div class="deck" id="deck"></div>
  <div class="detail" id="detail"></div>
  <div class="slips" id="slips"></div>
  <p class="note screen-only" id="asof"></p>
</div>

<script>
function askConfirm(msg, yesLabel, noLabel, onYes, onNo){
  document.querySelectorAll(".ask").forEach(x => x.remove());
  const bar = document.createElement("div"); bar.className = "ask"; bar.setAttribute("role", "alertdialog");
  const p = document.createElement("p"); p.textContent = msg;
  const y = document.createElement("button"); y.className = "btn"; y.textContent = yesLabel;
  const n = document.createElement("button"); n.className = "btn ghost"; n.textContent = noLabel;
  y.onclick = () => { bar.remove(); onYes && onYes(); };
  n.onclick = () => { bar.remove(); onNo && onNo(); };
  bar.append(p, y, n); document.body.appendChild(bar); y.focus();
}

  document.querySelectorAll(".slot").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); el.click(); } });
  document.querySelectorAll(".slot").forEach(el => el.onclick = () => {
    const bi = +el.dataset.bi;
    if (!drawn[bi]){
      const team = $("team").value;
      const take = () => { drawn[bi] = team; save(); renderDeck(); teams(); renderDetail([bi]); $("detail").scrollIntoView({behavior:"smooth"}); };
      if (Object.values(drawn).includes(team)){ askConfirm(team + "는 이미 카드를 뽑았습니다. 한 장 더 뽑을까요?", "한 장 더 뽑기", "취소", take); return; }
      take(); return;
    }
    renderDetail([bi]);
    $("detail").scrollIntoView({behavior:"smooth"});
  });
}

function caseHTML(c, hidden, team){
  const li = a => "<ul>" + a.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
  return `<article class="case${hidden ? " hidden" : ""}">
    <header><span class="no">${String(c.no).padStart(2, "0")}</span><h2>${esc(c.name)}</h2><span class="q">${esc(c.hook)}</span></header>
    ${team ? `<div class="golink"><span><b>${esc(team)}</b>가 뽑은 이슈입니다.</span><a class="btn" href="info-source-tool.html?team=${encodeURIComponent(team)}&issue=${c.no}">이 이슈로 정보 접촉 기록 시작</a></div>` : ""}
    <div class="grid2">
      <div class="field wide"><h4>무엇이 일어나고 있나</h4><p>${esc(c.what)}</p></div>
      <div class="field wide"><h4>논란 지점</h4><p>${esc(c.issue)}</p></div>
      <div class="field"><h4>누가 영향을 받나</h4>${li(c.affected)}</div>
      <div class="field"><h4>이해관계자</h4><p><b>득:</b> ${esc(c.gain)}<br><b>실:</b> ${esc(c.lose)}</p></div>
      <div class="field wide"><h4>토론 불씨</h4>
        <div class="debate"><div class="pro"><b>검사 측: 캠페인만으로는 안 된다</b>${esc(c.pro)}</div><div class="con"><b>변호 측: 커뮤니케이션으로 충분하다</b>${esc(c.con)}</div></div>
      </div>
    </div>
    <div class="src"><h4>참고 자료 (정보 접촉 기록에 쓸 수 있음)</h4>
      <table><thead><tr><th>자료</th><th>매체·날짜</th><th>담긴 근거</th></tr></thead><tbody>
      ${c.sources.map(s => `<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></td><td>${esc(s.outlet)}<br>${esc(s.date)}</td><td>${esc(s.evidence)}</td></tr>`).join("")}
      </tbody></table>
    </div>
  </article>`;
}
function renderDetail(list){
  const show = new Set(list);
  $("detail").innerHTML = BANK.map((c, i) => caseHTML(c, !show.has(i), drawn[i])).join("");
  $("detail").querySelectorAll(".golink a").forEach(a => a.addEventListener("click", () => {
    const u = new URL(a.href, location.href);
    try { localStorage.setItem("handoff", JSON.stringify({team: u.searchParams.get("team"), issue: u.searchParams.get("issue"), t: Date.now()})); } catch(e){}
  }));
}
function renderSlips(){
  $("slips").innerHTML = BANK.map(c => `<div class="slip"><b>${String(c.no).padStart(2, "0")}</b><h3>${esc(c.name)}</h3><p>${esc(c.hook)}</p></div>`).join("");
}

$("shuffle").onclick = () => {
  const go = () => { for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  drawn = {}; save(); renderDeck(); teams(); renderDetail([]); };
  if (Object.keys(drawn).length) askConfirm("뽑은 기록을 지우고 카드를 다시 섞을까요?", "다시 섞기", "취소", go); else go();
};
$("showall").onclick = () => renderDetail(BANK.map((_, i) => i));
$("printcards").onclick = () => { document.body.classList.remove("print-slips"); window.print(); };
$("printslips").onclick = () => { document.body.classList.add("print-slips"); window.print(); setTimeout(() => document.body.classList.remove("print-slips"), 500); };

if (IN_FRAME) document.querySelectorAll(".localonly").forEach(el => el.classList.add("hidden"));
load(); teams(); renderDeck(); renderSlips(); renderDetail(Object.keys(drawn).map(Number));
$("asof").textContent = "자료 확인일: " + AS_OF + ". 링크는 그날 접속해 내용을 확인했습니다.";
</script>
</body>
</html>
