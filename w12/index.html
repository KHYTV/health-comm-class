<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12주차 문제 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f5145;--green2:#2e6b5c;--head:#1f5145;--gold:#b5781f;--gold2:#e9b45a;--mint:#e6efec;--beige:#f3e6cf;--ink:#1d2b27;--muted:#5d6f69;--line:#d5e0dc;--bg:#fbfaf6;--card:#ffffff;--field:#ffffff;--zebra:#f5f8f7;--on:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--green:#2f7a66;--green2:#7cc4ad;--head:#9fd8c5;--gold:#e0a54e;--gold2:#f0c274;--mint:#1f2e2a;--beige:#3a3123;--ink:#e3ece8;--muted:#9fb3ac;--line:#2f403b;--bg:#111816;--card:#18221f;--field:#1d2925;--zebra:#1b2623;--on:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--green:#2f7a66;--green2:#7cc4ad;--head:#9fd8c5;--gold:#e0a54e;--gold2:#f0c274;--mint:#1f2e2a;--beige:#3a3123;--ink:#e3ece8;--muted:#9fb3ac;--line:#2f403b;--bg:#111816;--card:#18221f;--field:#1d2925;--zebra:#1b2623;--on:#ffffff;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 64px}
.eyebrow{color:var(--gold);font-weight:700;font-size:13px}
h1{color:var(--head);font-size:28px;margin:4px 0 6px}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 20px}
.flow div{background:var(--mint);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0}
.flow b{display:block;color:var(--head);font-size:14px}
.flow span{color:var(--muted);font-size:12px}
@media (max-width:640px){.flow{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.flow div{padding:6px;font-size:11px}.flow b{font-size:12px}.flow span{display:none}}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:var(--on);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--head);border:1px solid var(--head)}
select{padding:10px 12px;border:1px solid var(--head);border-radius:8px;font:inherit;font-weight:700;background:var(--card);color:var(--head);min-width:200px}
.pickrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pickrow small{color:var(--muted);font-size:13px}
.stage{display:flex;justify-content:center;margin:6px 0 4px}
.slot{perspective:900px;width:min(420px,100%);height:220px;cursor:pointer}
.flip{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.slot.open .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.back{background:var(--green);color:var(--on)}
.back b{font-size:44px;color:var(--gold2);line-height:1.1}
.back span{font-size:14px;opacity:.85;margin-top:8px}
.front{transform:rotateY(180deg);background:var(--card);border:2px solid var(--green);gap:6px}
.front .no{color:var(--gold);font-weight:700;font-size:26px;line-height:1}
.front h3{margin:0;color:var(--head);font-size:24px}
.front p{margin:0;font-size:14px;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:14px;width:min(420px,100%);height:220px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.same{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0}
.case{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:22px}
.case header{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--green);padding-bottom:8px;margin-bottom:14px;flex-wrap:wrap}
.case header .no{color:var(--gold);font-weight:700;font-size:24px}
.case header h2{margin:0;color:var(--head);font-size:22px}
.golink{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--beige);border-radius:8px;padding:12px 14px;margin-bottom:16px;flex-wrap:wrap}
.golink span{font-size:14px;flex:1;min-width:220px}
.golink .golinks{display:flex;gap:8px;flex-wrap:wrap;flex:0 1 auto;min-width:0}
.task{background:var(--mint);border-radius:8px;padding:12px 14px;font-size:15px;margin-bottom:16px}
.task b{display:block;font-size:13px;color:var(--gold);margin-bottom:2px}
.field{margin-bottom:14px}
.field h4{margin:0 0 4px;font-size:13px;color:var(--gold)}
.field p,.field ul,.field ol{margin:0;font-size:15px}
.field ul,.field ol{padding-left:20px}
.debate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.debate div{border-radius:8px;padding:10px 12px;font-size:14px}
.debate div:first-child{background:var(--beige)}.debate div:last-child{background:var(--mint)}
.debate b{display:block;font-size:12px;color:var(--head)}
@media (max-width:640px){.debate{grid-template-columns:1fr}}
.think{border-left:4px solid var(--gold);padding:6px 12px;font-weight:500}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--green);color:var(--on);text-align:left;padding:7px 8px;font-weight:500}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td a{color:var(--green2);word-break:break-all}
.theories table{min-width:560px}
details{margin-top:16px}
details summary{cursor:pointer;font-weight:700;color:var(--head)}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.btn:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.flip{transition:none}}
@media (max-width:640px){h1{font-size:23px;word-break:keep-all}}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1>문제 카드 뽑기</h1>
  <p class="lead">우리 조를 고르고 카드를 눌러 뽑으세요. 같은 조는 누가, 어느 기기에서 뽑아도 같은 카드가 나옵니다. 조원 모두 자기 휴대폰으로 열어 같은 카드를 보며 토론하세요.</p>

  <div class="flow" aria-label="오늘의 순서">
    <div><b>1 카드</b><span>조원 모두 같은 카드 · 맡을 이론 나누기</span></div>
    <div><b>2 내 캔버스</b><span>각자 · 목표·수용자·내 이론</span></div>
    <div><b>3 공유</b><span>각자 · 공유 코드를 조 단톡방에</span></div>
    <div><b>4 조 토론</b><span>서기 · 코드 모아 조 의견 정하기</span></div>
    <div><b>5 AI 제안</b><span>서기 · 조원과 공유, 조 최종안 LMS 제출</span></div>
  </div>

  <div class="pickrow">
    <select id="team" aria-label="우리 조"></select>
    <small id="teamhint"></small>
  </div>
  <div class="stage" id="stage"></div>
  <p class="same hidden" id="same"></p>
  <div id="detail"></div>
  <p class="note" id="asof"></p>
</div>

<script>

const ASSIGN = {"1조": 2, "2조": 3, "3조": 1, "4조": 1, "5조": 3, "6조": 2, "7조": 1, "8조": 2, "9조": 3, "10조": 3, "11조": 1, "12조": 2};
const TEAMS = Object.keys(ASSIGN);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qOf = team => D.questions.find(q => q.no === ASSIGN[team]);
let st = {team: "", opened: []};
function save(){ try{ localStorage.setItem("w12cards", JSON.stringify(st)); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem("w12cards")); if (v && Array.isArray(v.opened)) st = v; }catch(e){} }

function render(){
  const t = st.team, open = t && st.opened.includes(t);
  $("team").value = t;
  $("same").classList.toggle("hidden", !t);
  if (!t){
    $("stage").innerHTML = "<div class='empty'>위에서 우리 조를 고르면<br>카드가 나옵니다.</div>";
    $("detail").innerHTML = ""; $("teamhint").textContent = ""; return;
  }
  const q = qOf(t);
  $("stage").innerHTML = `<div class="slot${open ? " open" : ""}" id="slot" role="button" tabindex="0" aria-label="${open ? esc(q.name) : esc(t) + " 카드 뽑기"}"><div class="flip">
    <div class="face back"><b>${esc(t)}</b><span>${open ? "" : "눌러서 뽑기"}</span></div>
    <div class="face front"><div class="no">Q${q.no}</div><h3>${esc(q.name)}</h3><p>${esc(q.hook)}</p></div>
  </div></div>`;
  $("same").textContent = t + " 조원은 누가 뽑아도 이 카드가 나옵니다.";
  $("teamhint").textContent = open ? "" : "조원 중 누가 눌러도 됩니다.";
  const slot = $("slot");
  slot.onclick = () => {
    if (st.opened.includes(t)) return;
    st.opened.push(t); save(); slot.classList.add("open"); slot.querySelector(".back span").textContent = "";
    $("teamhint").textContent = ""; slot.setAttribute("aria-label", q.name);
    setTimeout(() => { renderDetail(t); $("detail").scrollIntoView({behavior: "smooth"}); }, 650);
  };
  slot.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); slot.click(); } };
  if (open) renderDetail(t); else $("detail").innerHTML = "";
}

  const li = a => a.map(x => "<li>" + esc(x) + "</li>").join("");
  $("detail").innerHTML = `<article class="case">
    <header><span class="no">Q${q.no}</span><h2>${esc(q.name)}</h2></header>
    <div class="golink"><span><b>${esc(t)}</b>의 문제 카드입니다. 조원은 각자 내 캔버스를 쓰고 공유 코드를 단톡방에 올립니다. 서기는 코드를 모아 조 토론판에서 정리합니다. 이론은 조원끼리 서로 다르게 나눠 맡으세요.</span>
      <span class="golinks"><a class="btn" href="planning-canvas.html?team=${encodeURIComponent(t)}">각자: 내 캔버스 쓰기</a>
      <a class="btn ghost" href="team-canvas.html?team=${encodeURIComponent(t)}">서기: 조 토론판</a></span></div>
    <div class="task"><b>과제</b>${esc(q.task)}</div>
    <div class="field"><h4>언제 · 어디서</h4><p>${esc(q.when)}</p></div>
    <div class="field"><h4>무슨 일이 있었나</h4><ul>${li(q.facts)}</ul></div>
    <div class="field"><h4>논란</h4><div class="debate">${q.sides.map(s => `<div><b>${esc(s[0])}</b>${esc(s[1])}</div>`).join("")}</div></div>
    <div class="field"><h4>주요 쟁점</h4><ol>${li(q.points)}</ol></div>
    <div class="field"><h4>생각해 보기</h4><p class="think">${esc(q.think)}</p></div>
    <div class="field"><h4>사례 자료</h4><div class="tablewrap"><table><thead><tr><th>구분</th><th>자료</th><th>매체·날짜</th></tr></thead><tbody>
      ${q.sources.map(s => `<tr><td>${esc(s.kind)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></td><td>${esc(s.outlet)}${s.date ? "<br>" + esc(s.date) : ""}</td></tr>`).join("")}
    </tbody></table></div></div>
    <details class="theories"><summary>고를 수 있는 이론 다섯 가지 한눈에</summary>
      <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>이론</th><th>수준</th><th>핵심 구성요소</th><th>가리키는 전략</th></tr></thead><tbody>
      ${D.theories.map(h => `<tr><td><b>${esc(h.id)}</b><br>${esc(h.name)}</td><td>${esc(h.level)}</td><td>${esc(h.parts.map(p => p[0]).join(", "))}</td><td>${esc(h.strategy)}</td></tr>`).join("")}
      </tbody></table></div>
    </details>
  </article>`;
}

$("eyebrow").textContent = D.week + " · " + D.title;
$("team").innerHTML = "<option value=''>우리 조를 고르세요</option>" + TEAMS.map(t => "<option>" + t + "</option>").join("");

load();
if (st.team && !TEAMS.includes(st.team)) st.team = "";
render();
$("asof").textContent = "사례와 자료 링크는 12주차 강의 슬라이드에서 가져왔습니다.";
</script>
